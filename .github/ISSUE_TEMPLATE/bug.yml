name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem does not go in an issue: use **Report a vulnerability** on the repository's Security tab.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you run, or the commit if you built it yourself.
      placeholder: v1.2.3
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and version, plus anything else that matters here, such as the architecture or browser.
      placeholder: Ubuntu 26.04, amd64
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Error messages, command output or log lines from around the time it happened.
      render: text
