# Shared Codacy scan. Each repository calls this from its own
# .github/workflows/codacy.yml, so the Codacy CLI version and the default tool
# list are kept here and nowhere else.
#
# It runs Codacy's analyzers with Codacy CLI v2 on the calling repository and
# uploads the results to that repository's GitHub code scanning. CLI v2 runs
# the tools directly, without Docker.
#
# Tools: a repository that has its own .codacy/codacy.yaml keeps it. One
# without gets the default list written below.
#
# Update the CLI by changing both env values below, taking the linux_amd64
# digest from https://github.com/codacy/codacy-cli-v2/releases. Callers follow
# @main, so a change here reaches every repository on its next run.

name: Codacy scan (shared)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    env:
      CODACY_CLI_VERSION: 1.0.0-main.387.sha.28c6773
      CODACY_CLI_SHA256: dfa47dad87d48df7a5076c57e0c124861b9a63903469e87e9b7af7323799fcbd
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Codacy CLI
        run: |
          archive="codacy-cli-v2_${CODACY_CLI_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/codacy/codacy-cli-v2/releases/download/${CODACY_CLI_VERSION}/${archive}"
          printf '%s  %s\n' "$CODACY_CLI_SHA256" "$archive" | sha256sum -c -
          mkdir codacy-cli
          tar -xzf "$archive" -C codacy-cli
          printf '%s\n' "$RUNNER_TEMP/codacy-cli" >> "$GITHUB_PATH"
      - name: Use the default tool list
        run: |
          if [ -f .codacy/codacy.yaml ]; then
            echo "Using the repository's own .codacy/codacy.yaml"
            exit 0
          fi
          mkdir -p .codacy
          cat > .codacy/codacy.yaml <<'YAML'
          tools:
              - opengrep@1.16.4
              - trivy@0.69.3
          YAML
      - name: Install analysis tools
        run: codacy-cli-v2 install
      - name: Run Codacy analysis
        run: codacy-cli-v2 analyze --format sarif --output "$RUNNER_TEMP/codacy.sarif"
      # A tool with no rule metadata gets "rules": null, which the upload rejects as invalid SARIF.
      - name: Normalize SARIF rules
        run: |
          jq '(.runs[].tool.driver.rules) //= []' "$RUNNER_TEMP/codacy.sarif" > "$RUNNER_TEMP/codacy.fixed.sarif"
          mv "$RUNNER_TEMP/codacy.fixed.sarif" "$RUNNER_TEMP/codacy.sarif"
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/codacy.sarif
